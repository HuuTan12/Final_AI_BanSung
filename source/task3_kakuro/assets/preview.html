<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kakuro Assets Preview</title><link rel="stylesheet" href="css/theme.css">
<style>
body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--kk-page);color:var(--kk-clue);padding:20px 16px 60px;transition:background .2s}
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;margin:28px 0 10px;text-transform:uppercase;letter-spacing:.08em;opacity:.7}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
button{font:inherit;padding:6px 14px;border-radius:999px;border:1px solid var(--kk-border);background:var(--kk-clue-bg);color:var(--kk-clue);cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--kk-hand)}
.boards{display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start}
svg.b{background:transparent;max-width:100%;height:auto}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.gal div{border:1px solid var(--kk-grid);border-radius:8px;padding:8px;text-align:center;font-size:11px;background:var(--kk-cell-bg)}
.gal svg{display:block;margin:0 auto 4px;height:46px;width:auto;max-width:80px}
code{font-size:12px}

function glyphs(p,kind,cls,str,cx,cy,s){ // draw a string of digits centred at cx,cy
  const gap=1.2*s;let tw=0;const gs=[...str].map(ch=>{const g=M[kind][ch];tw+=g.w*s;return[ch,g]});tw+=gap*(gs.length-1);
  let x=cx-tw/2;for(const[ch,g]of gs){use(p,(kind=='hand'?'hand-':kind=='clue'?'clue-':'lbl-')+ch,x,cy-g.h*s/2,g.w*s,g.h*s,cls);x+=g.w*s+gap}}
function board(spec){
  const R=spec.rows.length,K=spec.rows[0].length,P=1,W=(K+2)*C,Hh=(R+2)*C;
  const svg=el('svg',{class:'b',viewBox:`0 0 ${W} ${Hh}`,width:W*spec.zoom});
  const g=el('g',{transform:`translate(${C},${C})`},svg);
  const W_=(r,c)=>r>=0&&c>=0&&r<R&&c<K&&spec.rows[r][c]!='.';
  const D=(r,c)=>+spec.rows[r][c];
  for(let r=0;r<R;r++)for(let c=0;c<K;c++)if(W_(r,c)){
    const hi=spec.hi&&spec.hi.some(([a,b])=>a==r&&b==c);
    use(g,hi?'cell-highlight':'cell-empty',c*C,r*C,C,C);
    if(spec.show!==false)glyphs(g,'hand','kk-hand',String(D(r,c)),c*C+C/2,r*C+C/2,1);}
  // runs
  for(let r=0;r<R;r++)for(let c=0;c<K;c++)if(W_(r,c)){
    if(!W_(r,c-1)){let s=0,e=c;while(W_(r,e)){s+=D(r,e);e++}
      tri(g,'left',c*C-C/2,r*C,s);tri(g,'right',e*C,r*C,s)}
    if(!W_(r-1,c)){let s=0,e=r;while(W_(e,c)){s+=D(e,c);e++}
      tri(g,'up',c*C,r*C-C/2,s);tri(g,'down',c*C,e*C,s)}}
  (spec.ring||[]).forEach(([r,c])=>use(g,'ring',c*C,r*C,C,C));
  return svg}
function tri(g,d,x,y,s){
  const h=d=='up'||d=='down';use(g,'tri-'+d,x,y,h?C:C/2,h?C/2:C);
  const cx=x+(h?C/2:C/2*(d=='left'?.62:.38)),cy=y+(h?C/2*(d=='up'?.62:.38):C/2);
  glyphs(g,'clue','kk-clue',String(s),cx,cy,1.3)}
const boards=[
 {rows:['98.','753','.21'],zoom:1,hi:[[1,1]],ring:[[2,1]]},
 {rows:['..12.','..291','91386','894..','.25..'],zoom:.8}];
const bd=document.getElementById('boards');
boards.forEach(b=>bd.appendChild(board(b)));
// themes
const T=['classic','midnight','mint','sunset'],tb=document.getElementById('themes');
function setT(t){document.documentElement.dataset.theme=t;[...tb.children].forEach(b=>b.setAttribute('aria-pressed',b.textContent==t))}
T.forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>setT(t);tb.appendChild(b)});setT('classic');
// gallery
const gal=document.getElementById('gal');
document.querySelectorAll('symbol').forEach(s=>{const id=s.id,vb=s.getAttribute('viewBox').split(' ');
  const d=document.createElement('div');const svg=el('svg',{viewBox:s.getAttribute('viewBox'),style:'color:var(--kk-'+(id.startsWith('hand')?'hand':id.startsWith('clue')?'clue':'lbl')+')'});
  use(svg,id,0,0,vb[2],vb[3]);d.appendChild(svg);d.append(id);gal.appendChild(d)});
